name: Bug 报告
description: 报告一个可复现的问题
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认问题能在最新 `main` 上复现，并且没有包含 token、cookie 或账号密码。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 实际行为，以及你期望的行为。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. npm run dev
        2. 打开 http://127.0.0.1:8080
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先去掉 token、cookie、账号密码等敏感信息。
      render: text
  - type: input
    id: node
    attributes:
      label: Node.js 版本
      placeholder: v22.12.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器
      placeholder: Chrome 130 / Edge 130 / Safari 18
  - type: dropdown
    id: brain
    attributes:
      label: 选歌模式
      options:
        - external（默认，外部 DJ Bot）
        - internal（Claude / DeepSeek）
        - 不确定
    validations:
      required: true
  - type: input
    id: kugou-api
    attributes:
      label: KuGouMusicApi 上游
      placeholder: 仓库地址 / commit / fork 名称
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已经搜索过现有 Issue，没有找到相同问题。
          required: true
        - label: 我已确认内容里没有 token、cookie、账号密码或其它敏感信息。
          required: true
